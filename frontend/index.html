<!doctype html>
<!--
Provide Food4Thought's customer page structure for filtering restaurants and
displaying selected details and menus. Labeled controls and live feedback regions
support keyboard and assistive-technology use, while the discovery script retrieves
data through the API.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food4Thought – Restaurants</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="./"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="icons.svg#brand"></use></svg></span>Food4Thought</a>
      <nav aria-label="Main navigation">
        <a href="./" aria-current="page">Browse restaurants</a>
        <a href="account.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#user"></use></svg> My account</a>
        <a href="cart.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#bag"></use></svg> My cart</a>
      </nav>
    </header>

    <main id="main-content" tabindex="-1" class="layout">
      <section id="discovery-hero" class="hero" aria-labelledby="hero-heading">
        <div class="hero-copy">
          <h1 id="hero-heading">Find your next<br class="hero-break" /> favourite meal.</h1>
          <p>Browse restaurant menus and order the food you’re craving.</p>
        </div>
        <div class="hero-photo" aria-hidden="true"></div>
      </section>

      <div id="discovery-grid" class="discovery-grid">
        <section class="discovery-list" aria-labelledby="list-heading">
          <div class="list-heading">
            <h2 id="list-heading">Restaurants</h2>
            <form id="filter-form" class="filter" role="search" aria-label="Filter restaurants">
              <label class="visually-hidden" for="cuisine-input">Cuisine</label>
              <div class="search-field"><svg class="icon" aria-hidden="true"><use href="icons.svg#search"></use></svg>
                <input id="cuisine-input" name="cuisine" type="search" placeholder="Filter by cuisine" />
              </div>
              <button type="submit">Filter</button>
              <button type="button" id="clear-filter">Clear</button>
            </form>
          </div>
          <p id="list-status" class="status" role="status"></p>
          <ul id="restaurant-list" class="restaurant-list"></ul>
        </section>

        <section id="restaurant-details" class="panel" aria-labelledby="details-heading" hidden>
          <a class="back-link" href="#">&larr; Back to restaurants</a>
          <h2 id="details-heading" class="visually-hidden">Restaurant details</h2>
          <p id="details-status" class="status" role="status"></p>
          <div id="details-content" hidden>
            <h2 id="details-name" tabindex="-1"></h2>
            <p class="badge badge-available" id="details-cuisine"></p>
            <p id="details-description"></p>
            <a id="edit-restaurant-link" class="button-link" hidden>Edit restaurant</a>
            <h3 class="menu-heading">Menu</h3>
            <p id="menu-status" class="status" role="status"></p>
            <ul id="menu-list" class="menu-list"></ul>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <a href="staff-sign-in.html">Staff sign in</a>
      <a href="create-restaurant.html">Create restaurant</a>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
