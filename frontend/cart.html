<!doctype html>
<!--
Present Food4Thought's customer cart and saved checkout receipt using the REST API.
Accessible form controls and status messages keep cart changes and recovery explicit.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food4Thought – My cart</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="./"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="icons.svg#brand"></use></svg></span>Food4Thought</a>
      <nav aria-label="Main navigation">
        <a href="./">Browse restaurants</a>
        <a href="account.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#user"></use></svg> My account</a>
        <a href="cart.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="icons.svg#bag"></use></svg> My cart</a>
      </nav>
    </header>
    <main id="main-content" tabindex="-1" class="management-layout cart-layout">
      <h1>My cart</h1>
      <p id="cart-status" class="status" role="status"></p>
      <p id="cart-error" class="status error" role="alert"></p>
      <div class="cart-toolbar">
        <button id="refresh-cart" type="button">Refresh cart</button>
        <button id="create-cart" type="button" hidden>Create cart</button>
      </div>
      <section id="cart-content" class="cart-content" aria-label="Current cart" hidden>
        <div class="panel">
          <h2>Items</h2>
          <ul id="cart-items" class="cart-items"></ul>
        </div>
        <div class="panel order-summary">
          <h2>Order summary</h2>
          <p class="cart-summary">Subtotal <strong id="cart-subtotal"></strong></p>
          <p class="cart-summary cart-total">Total <strong id="cart-total"></strong></p>
          <p class="account-note">Menu prices are confirmed at checkout. Total excludes tax and fees.</p>
          <div class="cart-toolbar">
            <button id="clear-cart" type="button">Clear cart</button>
            <button id="checkout-button" type="button" class="primary-action">Place order</button>
          </div>
        </div>
      </section>
      <section id="order-confirmation" class="panel" aria-labelledby="order-heading" hidden>
        <h2 id="order-heading">Order saved</h2>
        <p id="order-state" class="badge badge-available" hidden>Placed</p>
        <p>Order ID: <strong id="order-id"></strong></p>
        <p id="order-restaurant"></p>
        <ul id="order-items" class="cart-items"></ul>
        <p class="cart-summary">Saved total <strong id="order-total"></strong></p>
      </section>
      <section id="checkout-help" class="panel" aria-label="Checkout recovery" hidden>
        <p id="checkout-status" class="status" role="status"></p>
        <div class="cart-toolbar">
          <button id="check-order" type="button">Check order status</button>
          <button id="retry-checkout" type="button" hidden>Retry original checkout</button>
        </div>
      </section>
    </main>
    <script type="module" src="cart.js"></script>
  </body>
</html>
