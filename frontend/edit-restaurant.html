<!doctype html>
<!--
Provide Food4Thought's management form for editing the restaurant selected by its
stable ID. Labeled controls and feedback regions support the edit script's API-loaded
values, validation messages, and navigation back to restaurant details.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food4Thought – Edit restaurant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="./"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="icons.svg#brand"></use></svg></span>Food4Thought</a>
      <nav aria-label="Main navigation">
        <a href="./">Browse restaurants</a>
        <a href="create-restaurant.html">Create restaurant</a>
        <a href="staff-sign-in.html" id="staff-signin-link">Staff sign in</a>
      </nav>
    </header>

    <main id="main-content" tabindex="-1" class="management-layout editor-layout">
      <div class="editor-heading">
        <h1>Edit restaurant</h1>
        <a id="return-link" class="button-link" hidden>Back to restaurant</a>
      </div>
      <p id="edit-access" class="status warning" aria-live="polite"></p>
      <div class="editor-grid">
        <section class="panel" aria-labelledby="edit-heading">
          <h2 id="edit-heading">Restaurant information</h2>
          <p id="edit-status" class="status" role="status"></p>
          <div id="edit-errors" class="status error" role="alert"></div>
          <button id="retry-load" type="button" hidden>Retry loading</button>

          <form id="edit-form">
            <fieldset id="edit-fields" class="create-fields" disabled aria-describedby="edit-access">
              <legend class="visually-hidden">Restaurant information</legend>
              <label for="restaurant-name">Name</label>
              <input id="restaurant-name" name="name" type="text" required />

              <label for="restaurant-cuisine">Cuisine</label>
              <input id="restaurant-cuisine" name="cuisine" type="text" required />

              <label for="restaurant-description">Description</label>
              <textarea id="restaurant-description" name="description" rows="4" required></textarea>

              <button type="submit">Save changes</button>
            </fieldset>
          </form>
        </section>
        <section id="menu-management" class="panel" aria-labelledby="management-heading" aria-describedby="edit-access" hidden>
          <h2 id="management-heading">Menu availability</h2>
          <p id="availability-feedback" class="status" aria-live="polite"></p>
          <ul id="management-menu" class="management-menu"></ul>
        </section>
      </div>
    </main>

    <script type="module" src="edit-restaurant.js"></script>
  </body>
</html>
