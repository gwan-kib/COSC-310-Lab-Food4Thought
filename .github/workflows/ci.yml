# Check Food4Thought's application and tests on pushes and pull requests to main
# using Python 3.12 and pinned dependencies. Require Chromium browser tests
# alongside backend checks and reject changes to committed data so unavailable
# browser coverage or unsafe test writes cannot pass silently.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall app
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        env:
          # Fail, rather than skip, if the browser tests cannot run.
          REQUIRE_BROWSER_TESTS: "1"
        run: python -m pytest
      - name: Confirm tests left committed data unchanged
        run: git diff --exit-code -- data/
