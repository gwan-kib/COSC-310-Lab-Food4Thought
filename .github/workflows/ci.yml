# Run Food4Thought's automated checks on pushes and pull requests to main.
# It installs the Python and browser-test dependencies, compiles the application, runs
# required-browser pytest, and checks that committed data remains unchanged.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall app
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        env:
          # Fail, rather than skip, if the browser tests cannot run.
          REQUIRE_BROWSER_TESTS: "1"
        run: python -m pytest
      - name: Confirm tests left committed data unchanged
        run: git diff --exit-code -- data/
