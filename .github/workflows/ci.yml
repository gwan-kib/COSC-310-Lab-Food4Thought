# Check Food4Thought's application and tests on pushes and pull requests to main
# using Python 3.12 and pinned dependencies. Require Chromium browser tests
# alongside backend checks and reject changes or new files under data/ so
# unavailable browser coverage or unsafe test writes cannot pass silently.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall app
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Diagnose issue 95 cross-subsystem suite
        run: python -m pytest -q tests/test_cross_subsystem_persistence.py
      - name: Run tests
        env:
          # Fail, rather than skip, if the browser tests cannot run.
          REQUIRE_BROWSER_TESTS: "1"
        run: timeout --signal=INT 120s python -m pytest -vv --tb=short
      - name: Confirm tests left application data unchanged
        if: ${{ !cancelled() }}
        run: |
          changes=$(git status --porcelain --untracked-files=all --ignored -- data/)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
