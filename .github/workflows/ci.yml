# Check Food4Thought's application and tests on pushes and pull requests to main
# using Python 3.12 and pinned dependencies. Require Chromium browser tests
# alongside backend checks and reject changes or new files under data/ so
# unavailable browser coverage or unsafe test writes cannot pass silently.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall app
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Check out test-first baseline
        uses: actions/checkout@v6
        with:
          ref: 6bba3c890cdf391200dc6574663ed3d57d1c7843
          path: test-first-baseline
      - name: Confirm public menu regression fails on baseline
        timeout-minutes: 2
        working-directory: test-first-baseline
        env:
          REQUIRE_BROWSER_TESTS: "1"
        run: |
          set +e
          python -m pytest -q 'tests/browser/test_staff_sign_in_browser.py::test_public_menu_is_read_only[False]' > "$RUNNER_TEMP/food4thought-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/food4thought-red.log"
          test "$status" -eq 1
          grep -F 'Expected: 0' "$RUNNER_TEMP/food4thought-red.log"
          grep -F 'Mark unavailable' "$RUNNER_TEMP/food4thought-red.log"
      - name: Run tests
        timeout-minutes: 4
        env:
          # Fail, rather than skip, if the browser tests cannot run.
          REQUIRE_BROWSER_TESTS: "1"
        run: python -m pytest
      - name: Confirm tests left application data unchanged
        if: ${{ !cancelled() }}
        run: |
          changes=$(git status --porcelain --untracked-files=all --ignored -- data/)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
